# Render Blueprint: one Docker web service (app + API). The database is external (see docs/DEPLOY.md).
services:
  - type: web
    name: urbantwin
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # your hosted PostGIS database URL; paste it in the Render dashboard
        sync: false
      - key: STAFF_TOKEN         # generated by Render; read it in the dashboard, it is the staff password
        generateValue: true
      - key: GEMINI_API_KEY      # optional; leave empty to run without AI
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: UPLOAD_DIR
        value: /app/backend/uploads
